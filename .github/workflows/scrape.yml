name: Scrape Proxies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run scraper
        run: python collect_proxy.py
      
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git add subscribe.txt
          git diff --quiet --staged || git commit -m "更新节点订阅"
          git push
