name: Node Pool v10

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install aiohttp

      - name: run
        run: python scraper.py

      - name: commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add valid_nodes.txt
          git commit -m "v10 update" || echo "no change"
          git push
