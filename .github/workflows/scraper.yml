name: scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install aiohttp

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output.txt
          if git status --porcelain | grep -q output.txt; then
            git commit -m "auto update subscription data"
            git push origin HEAD
          else
            echo "No new data changed, skip commit"
          fi
